name: CI

on:
  push:
  pull_request:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Development shell
        run: nix develop --command odin version
      - name: Build and test
        run: nix build --print-build-logs

  # The Windows x64 build for GameNative on Android (work item 0102,
  # doc/build.md). Builds and packages only: the tests assume Unix paths
  # and sockets and stay in the nix job.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Short commit
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Download the latest Odin release
        run: tools/ci_download_odin.sh windows-amd64
      - name: Download the latest SDL3 release and give Odin its SDL3.lib
        run: |
          downloads="$(cygpath -u "$RUNNER_TEMP")"
          # The highest release-3.x.y by version, not the newest by date:
          # SDL 2 releases share the repository, and an older 3.x line can
          # publish after a newer one.
          tag="$(gh api 'repos/libsdl-org/SDL/releases?per_page=100' --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^release-3\\.[0-9]+\\.[0-9]+$")))] | max_by(.tag_name | ltrimstr("release-") | split(".") | map(tonumber)) | .tag_name')"
          version="${tag#release-}"
          asset="SDL3-devel-$version-VC.zip"
          digest="$(gh api "repos/libsdl-org/SDL/releases/tags/$tag" --jq ".assets[] | select(.name == \"$asset\") | .digest")"
          if [ "${digest#sha256:}" = "$digest" ]; then
            echo "no SHA-256 digest for $asset in $tag: '$digest'" >&2
            exit 1
          fi
          curl --fail --location --silent --show-error --output "$downloads/sdl3.zip" "https://github.com/libsdl-org/SDL/releases/download/$tag/$asset"
          echo "${digest#sha256:}  $downloads/sdl3.zip" | sha256sum --check -
          7z x -o"$downloads/sdl3" "$downloads/sdl3.zip" > /dev/null
          cp "$downloads/sdl3/SDL3-$version/lib/x64/SDL3.lib" "$(dirname "$ODIN")/vendor/sdl3/"
          echo "SDL3_DLL=$downloads/sdl3/SDL3-$version/lib/x64/SDL3.dll" >> "$GITHUB_ENV"
          echo "SDL3 $version"
      - name: Build release
        run: MINE_OH_BELOWED_COMMIT="$SHORT_SHA" ./build.sh release
      - name: Package
        run: |
          package=dist/mine-oh-belowed
          mkdir -p "$package"
          cp build/mine-oh-belowed.exe "$SDL3_DLL" "$package/"
          cp -r data "$package/"
          cat > "$package/README.txt" <<README
          Mine oh Belowed, Windows x64 build (commit $SHORT_SHA)

          A voxel automation game. Start mine-oh-belowed.exe; it finds the
          data folder beside itself, and SDL3.dll must stay beside it too. The title
          screen and the pause menu show the build stamp: this commit and
          the build time.

          Made for GameNative on Android (Wine): point the app at
          mine-oh-belowed.exe. The log is log.txt beside mine-oh-belowed.exe.
          Inside the Wine container the other files land in
            screenshots:   C:\users\<user>\AppData\Local\mine-oh-belowed\screenshots
            saves:         C:\users\<user>\AppData\Roaming\mine-oh-belowed\saves
            configuration: C:\users\<user>\AppData\Roaming\mine-oh-belowed\config.sjson
          (%LOCALAPPDATA% and %APPDATA%). The Windows build has no command
          socket and writes no crash trace on a fatal signal.
          README
          ls -R "$package" | head -n 20
      - uses: actions/upload-artifact@v7
        with:
          name: mine-oh-belowed-windows-x64-${{ env.SHORT_SHA }}
          path: dist/
          if-no-files-found: error

  # The native Android app (work items 0113 and 0114, doc/android.md, CI
  # and installing). tools/android_env.sh takes the runner's newest NDK
  # and build-tools under ANDROID_HOME, the bundler its newest platform,
  # and the runner's Java runs apksigner, so build.sh runs on the runner
  # directly. The full history gives the commit count, which is the APK's
  # version code.
  android:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Short commit
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Download the latest Odin release
        run: tools/ci_download_odin.sh linux-amd64
      - name: Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          java -version
      - name: Check
        run: MINE_OH_BELOWED_COMMIT="$SHORT_SHA" ./build.sh check-android
      - name: Build the APK
        run: MINE_OH_BELOWED_COMMIT="$SHORT_SHA" ./build.sh android
      - uses: actions/upload-artifact@v7
        with:
          name: mine-oh-belowed-android-arm64-${{ env.SHORT_SHA }}
          path: build/android/mine-oh-belowed.apk
          if-no-files-found: error
